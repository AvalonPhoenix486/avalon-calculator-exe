<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Avalon Calculator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="stage">
    <div class="crystal-glow" aria-hidden="true"></div>

    <header class="crest">
      <div class="crest-brand">
        <div class="crest-mark" aria-hidden="true">
          <svg viewBox="0 0 100 160" class="facet-mark">
            <polygon class="facet facet-l" points="50,6 12,72 50,80"></polygon>
            <polygon class="facet facet-r" points="50,6 88,72 50,80"></polygon>
            <polygon class="facet facet-l2" points="50,80 12,72 50,154"></polygon>
            <polygon class="facet facet-r2" points="50,80 88,72 50,154"></polygon>
            <path class="facet-edge" d="M50,6 L12,72 L50,154 L88,72 Z M50,6 L50,154 M12,72 L88,72" />
          </svg>
        </div>
        <span class="crest-title">AVALON</span>
      </div>
      <div class="crest-actions">
        <button class="goal-toggle" id="goalToggle" aria-label="Fechamento da meta mensal" aria-expanded="false" aria-controls="goalModule">
          <svg viewBox="0 0 24 24" class="goal-toggle-icon" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="12" cy="12" r="1.4" fill="currentColor"/>
          </svg>
        </button>
        <button class="cash-toggle" id="cashToggle" aria-label="Conferência do caixa" aria-expanded="false" aria-controls="cashModule">
          <svg viewBox="0 0 24 24" class="cash-toggle-icon" aria-hidden="true">
            <rect x="3" y="6.5" width="18" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
        <button class="history-toggle" id="historyToggle" aria-label="Histórico" aria-expanded="false" aria-controls="historyPanel">
          <svg viewBox="0 0 24 24" class="history-toggle-icon" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 7.5V12l3.2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="calc" role="application" aria-label="Avalon Calculator">
      <section class="display" aria-live="polite">
        <div class="display-expr" id="expr"></div>
        <div class="display-value" id="value">0</div>
      </section>

      <section class="pad" id="pad">
        <button class="key key-func" data-action="clear" id="clearKey">C</button>
        <button class="key key-func" data-action="negate">+/&minus;</button>
        <button class="key key-func" data-action="percent">%</button>
        <button class="key key-op" data-action="op" data-op="÷">÷</button>

        <button class="key key-num" data-num="7">7</button>
        <button class="key key-num" data-num="8">8</button>
        <button class="key key-num" data-num="9">9</button>
        <button class="key key-op" data-action="op" data-op="×">×</button>

        <button class="key key-num" data-num="4">4</button>
        <button class="key key-num" data-num="5">5</button>
        <button class="key key-num" data-num="6">6</button>
        <button class="key key-op" data-action="op" data-op="−">&minus;</button>

        <button class="key key-num" data-num="1">1</button>
        <button class="key key-num" data-num="2">2</button>
        <button class="key key-num" data-num="3">3</button>
        <button class="key key-op" data-action="op" data-op="+">+</button>

        <button class="key key-func" data-action="backspace" aria-label="Apagar">⌫</button>
        <button class="key key-num" data-num="0">0</button>
        <button class="key key-num" data-action="decimal">.</button>
        <button class="key key-equals" data-action="equals">=</button>
      </section>
    </main>

    <div class="history-backdrop" id="historyBackdrop" hidden></div>
    <aside class="history-panel" id="historyPanel" aria-hidden="true" aria-label="Histórico de cálculos">
      <div class="history-head">
        <span class="history-title">Histórico</span>
        <div class="history-head-actions">
          <button class="history-clear" id="historyClear" type="button">Limpar</button>
          <button class="history-close" id="historyClose" type="button" aria-label="Fechar histórico">✕</button>
        </div>
      </div>
      <div class="history-list" id="historyList"></div>
    </aside>

    <div class="goal-backdrop" id="goalBackdrop" hidden></div>
    <section class="goal-module" id="goalModule" aria-hidden="true" aria-label="Fechamento Geral da Meta Mensal">
      <div class="goal-scroll">
        <div class="goal-head">
          <span class="goal-title">Fechamento Geral da Meta Mensal</span>
          <button class="goal-close" id="goalClose" type="button" aria-label="Fechar">✕</button>
        </div>

        <div class="goal-month-nav">
          <button class="goal-month-arrow" id="goalPrevMonth" type="button" aria-label="Mês anterior">‹</button>
          <span class="goal-month-label" id="goalMonthLabel"></span>
          <button class="goal-month-arrow" id="goalNextMonth" type="button" aria-label="Próximo mês">›</button>
        </div>

        <div class="goal-status-row">
          <span class="goal-status-badge" id="goalStatusBadge">ABERTO</span>
          <button class="goal-close-month-btn" id="goalCloseMonthBtn" type="button">Encerrar Mês</button>
          <button class="goal-reopen-month-btn" id="goalReopenMonthBtn" type="button" hidden>Reabrir Mês</button>
        </div>

        <div class="goal-months-history">
          <button class="goal-months-toggle" id="goalMonthsToggle" type="button" aria-expanded="false">Histórico de meses</button>
          <div class="goal-months-list" id="goalMonthsList" hidden></div>
        </div>

        <div class="goal-field">
          <label for="goalMetaInput">Meta mensal</label>
          <div class="goal-field-row">
            <input type="text" inputmode="decimal" id="goalMetaInput" placeholder="R$ 0,00" autocomplete="off" />
            <button class="goal-btn" id="goalMetaSave" type="button">Salvar</button>
          </div>
        </div>

        <div class="goal-report" id="goalReport"></div>

        <div class="goal-field">
          <label for="goalSaleValue" id="goalSaleLabel">Registrar venda do dia</label>
          <div class="goal-field-row goal-field-row--record">
            <input type="date" id="goalSaleDate" />
            <input type="text" inputmode="decimal" id="goalSaleValue" placeholder="R$ 0,00" autocomplete="off" />
            <button class="goal-btn" id="goalSaleSave" type="button">Registrar</button>
          </div>
          <div class="goal-duplicate-warning" id="goalDuplicateWarning" hidden></div>
          <div class="goal-edit-banner" id="goalEditBanner" hidden>
            Editando o registro de <strong id="goalEditBannerDate"></strong>.
            <button type="button" class="goal-edit-cancel" id="goalEditCancel">Cancelar edição</button>
          </div>
        </div>

        <div class="goal-history">
          <div class="goal-history-head">
            <span class="goal-history-title">Registros do mês</span>
            <button class="goal-clear-sales" id="goalClearSales" type="button">Limpar registros</button>
          </div>
          <div class="goal-history-columns">
            <span>Data</span><span>Venda</span><span>Ações</span>
          </div>
          <div class="goal-history-list" id="goalHistoryList"></div>
        </div>

        <div class="goal-backup">
          <span class="goal-backup-title">Backup do mês</span>
          <span class="goal-backup-month" id="goalBackupMonthLabel"></span>
          <div class="goal-backup-actions">
            <button class="goal-btn" id="goalBackupSave" type="button">Fazer backup</button>
            <button class="goal-backup-restore-btn" id="goalBackupRestoreBtn" type="button">Restaurar backup</button>
            <input type="file" id="goalBackupFileInput" accept="application/json,.json" hidden />
          </div>
        </div>
      </div>
    </section>

    <div class="cash-backdrop" id="cashBackdrop" hidden></div>
    <section class="cash-module" id="cashModule" aria-hidden="true" aria-label="Conferência do Caixa">
      <div class="cash-scroll">
        <div class="cash-head">
          <span class="cash-title">Conferência do Caixa</span>
          <button class="cash-close" id="cashClose" type="button" aria-label="Fechar">✕</button>
        </div>

        <input type="date" id="cashDate" class="cash-date-input" aria-label="Data da conferência" />

        <div class="cash-crystal-wrap">
          <svg viewBox="0 0 100 160" class="cash-crystal" id="cashCrystal" aria-hidden="true">
            <polygon class="facet facet-l" points="50,6 12,72 50,80"></polygon>
            <polygon class="facet facet-r" points="50,6 88,72 50,80"></polygon>
            <polygon class="facet facet-l2" points="50,80 12,72 50,154"></polygon>
            <polygon class="facet facet-r2" points="50,80 88,72 50,154"></polygon>
            <path class="facet-edge" d="M50,6 L12,72 L50,154 L88,72 Z M50,6 L50,154 M12,72 L88,72" />
          </svg>
          <div class="cash-crystal-status" id="cashCrystalStatus">Aguardando contagem</div>
        </div>

        <div class="cash-field">
          <label for="cashFundoInput">Fundo fixo do caixa</label>
          <div class="goal-field-row">
            <input type="text" inputmode="decimal" id="cashFundoInput" placeholder="R$ 100,00" autocomplete="off" />
            <button class="goal-btn" id="cashFundoSave" type="button">Salvar</button>
          </div>
        </div>

        <div class="cash-info" id="cashSaleInfo" hidden></div>

        <div class="cash-group">
          <span class="cash-group-title">Cédulas</span>
          <div class="cash-denom-list" id="cashBillsList"></div>
          <div class="cash-group-total" id="cashBillsTotal"></div>
        </div>

        <div class="cash-group">
          <span class="cash-group-title">Moedas</span>
          <div class="cash-denom-list" id="cashCoinsList"></div>
          <div class="cash-group-total" id="cashCoinsTotal"></div>
        </div>

        <div class="cash-missing-warning" id="cashMissingWarning" hidden></div>

        <div class="cash-result" id="cashResult"></div>

        <div class="cash-actions">
          <button class="goal-btn cash-verify-btn" id="cashVerifyBtn" type="button">Conferir Caixa</button>
          <button class="cash-clear-btn" id="cashClearBtn" type="button">Limpar contagem</button>
        </div>
      </div>
    </section>
  </div>

  <script src="calculator.js"></script>
  <script src="calendar-engine.js"></script>
  <script src="monthly-closing-engine.js"></script>
  <script src="monthly-goal-store.js"></script>
  <script src="history.js"></script>
  <script src="goal-module.js"></script>
  <script src="cash-denominations.js"></script>
  <script src="cash-counter.js"></script>
  <script src="cash-reconciliation.js"></script>
  <script src="cash-module.js"></script>
  <script src="app.js"></script>
</body>
</html>
