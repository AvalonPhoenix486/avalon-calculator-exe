[package]
name = "avalon-calculator"
version = "0.1.0"
description = "Calculadora com identidade visual do cristal Avalon (app independente)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "avalon_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
